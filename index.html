@import url('https://fonts.googleapis.com/css2?family=Nanum+Square+Round:wght@400;700;800&display=swap');
:root{--purple:#70577F;--lav:#F2EAF7;--pink:#E58B9D;--mint:#83B99B;--text:#5F526A}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:'Nanum Square Round',sans-serif;line-height:1.6}
.shell{width:min(1120px,94%);margin:auto}header{padding:22px 0 12px}.back{display:inline-block;background:var(--lav);color:var(--purple);padding:10px 17px;border-radius:30px;text-decoration:none;font-weight:800}
h1{color:var(--purple);font-size:clamp(25px,4vw,36px);margin:18px 0 5px}.intro{color:#887b91;margin:0 0 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input[type=search]{flex:1;min-width:210px;padding:13px 15px;border:1px solid #e8dfeb;border-radius:13px;font:inherit}
.progress{background:#faf8fb;border-radius:14px;padding:12px 15px;color:var(--purple);font-weight:800}
.daily-area{background:#F1F5FC;border:1px solid #E5EAF4;border-radius:18px;padding:18px 20px;margin:18px 0;color:#526C96}
.daily-area strong{display:block;font-size:20px;margin-bottom:4px}
.daily-area span{font-size:13px;color:#71809A}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}
.tabs .tab:nth-child(1),.tabs .tab:nth-child(2){grid-column:span 2}
.tab{border:1px solid #eee7f0;border-radius:16px;padding:13px 10px;background:#fff;text-align:left;color:var(--purple);cursor:pointer;font:inherit;font-weight:800}
.tab.active{background:var(--lav);border-color:#d9c9e2}.tab small{display:block;color:#95889b;font-size:11px;font-weight:500}
.area-heading{font-size:23px;color:var(--purple);margin:25px 0 4px}.area-desc{color:#93869a;margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.video{border:1px solid #eee7f0;border-radius:16px;padding:16px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.video.done{background:#f3f8f4;border-color:#cfe4d5}.check{width:22px;height:22px;accent-color:#6e9e7d;flex-shrink:0;margin-top:3px}
.vtitle{font-weight:800;color:#5f526a;margin:0 0 7px;font-size:16px}.meta{font-size:12px;color:#9a8da0;margin-bottom:10px}
.watch{display:inline-block;background:#70577f;color:#fff;padding:7px 12px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:800}
.watch:hover{background:#594466}.empty{padding:30px;text-align:center;color:#998da0}
.note{font-size:12px;color:#9a8da0;margin:25px 0 35px}
@media(max-width:700px){

  .tabs .tab:nth-child(1),.tabs .tab:nth-child(2){grid-column:span 1}
  .cards{grid-template-columns:1fr}.video{padding:13px}
}

tabs.innerHTML='';
const todayBtn=document.createElement('button');todayBtn.className='tab'+(active===today[0]?' active':'');todayBtn.innerHTML=`🌞 오늘의 영역<small>${today[0]} 영상 보기</small>`;todayBtn.onclick=()=>{active=today[0];render()};tabs.appendChild(todayBtn);
const all=document.createElement('button');all.className='tab'+(active==='전체'?' active':'');all.innerHTML='📚 전체 영역<small>전체 영상 모아보기</small>';all.onclick=()=>{active='전체';render()};tabs.appendChild(all);
areas.forEach(([name,icon,desc])=>{const b=document.createElement('button');b.className='tab'+(active===name?' active':'');b.innerHTML=`${icon} ${name}<small>${videos.filter(v=>v.area===name).length}개 영상</small>`;b.onclick=()=>{active=name;render()};tabs.appendChild(b)});}
function render(){drawTabs();const q=document.getElementById('search').value.trim().toLowerCase();content.innerHTML='';
const groups=active==='전체'?areas:areas.filter(a=>a[0]===active);
let shown=0;
groups.forEach(([name,icon,desc])=>{const list=videos.filter(v=>v.area===name&&(!q||(v.title+' '+v.area).toLowerCase().includes(q)));if(!list.length)return;shown+=list.length;
const h=document.createElement('h2');h.className='area-heading';h.textContent=icon+' '+name;content.appendChild(h);
const p=document.createElement('p');p.className='area-desc';p.textContent=desc;content.appendChild(p);
const grid=document.createElement('div');grid.className='cards';
list.forEach((v)=>{const idx=videos.indexOf(v);const id=String(idx);const card=document.createElement('article');card.className='video'+(watched[id]?' done':'');
const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=!!watched[id];check.setAttribute('aria-label','시청 완료 체크');check.onchange=()=>{watched[id]=check.checked;localStorage.setItem(STORE,JSON.stringify(watched));render();};
const body=document.createElement('div');body.style.flex='1';const title=document.createElement('p');title.className='vtitle';title.textContent=v.title;const meta=document.createElement('div');meta.className='meta';meta.textContent='유치원 대상 · 나침반 안전교육 영상';const a=document.createElement('a');a.className='watch';a.href=v.url;a.target='_blank';a.rel='noopener';a.textContent='▶ 영상 바로 보기';body.append(title,meta,a);card.append(check,body);grid.appendChild(card);});
content.appendChild(grid);});
if(!shown)content.innerHTML='<div class="empty">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</div>';updateProgress();}
document.getElementById('search').addEventListener('input',render);render();
</script></body></html>
